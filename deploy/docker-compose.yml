# 生产部署编排（单机 2C2G）
# 用法：在服务器上 docker compose -f deploy/docker-compose.yml up -d
version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置}
      POSTGRES_DB: teamup
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamup"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://teamup:${POSTGRES_PASSWORD}@db:5432/teamup
      REDIS_URL: redis://redis:6379
      COOKIE_SECRET: ${COOKIE_SECRET:?请在 .env 中设置}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      QQ_SMTP_HOST: ${QQ_SMTP_HOST:-}
      QQ_SMTP_PORT: ${QQ_SMTP_PORT:-465}
      QQ_SMTP_USER: ${QQ_SMTP_USER:-}
      QQ_SMTP_PASS: ${QQ_SMTP_PASS:-}
    # 2C2G 内存预算：API ~250MB
    deploy:
      resources:
        limits:
          memory: 320M

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # 静态资源 + 反代
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  pgdata:
