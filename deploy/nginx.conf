# 生产 nginx 配置（挂载到 web 容器 /etc/nginx/conf.d/default.conf）
#
# TLS 说明：当前仅监听 80（明文）。如需启用 HTTPS，请：
#   1) 取消下方 443 server 块的注释，并填入证书路径 / server_name
#   2) 将 80 server 改为 301 跳转到 https（见文末注释）
#   3) 在 deploy/.env 中设置 COOKIE_SECURE=true，否则后端下发带 Secure 标志的
#      cookie 后，浏览器在 http 下会拒收，导致登录直接失效。
#   即：启用 TLS 后取消注释并设置 COOKIE_SECURE=true

server {
    listen 80;
    server_name _;

    # 前端静态资源（多阶段构建产物已拷入镜像）
    root /usr/share/nginx/html;
    index index.html;

    # M14：安全响应头（always 保证错误响应也带上）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 不在此处加 Content-Security-Policy：Element Plus 使用内联样式，CSP 会破坏页面渲染

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代（含 Cookie 会话）
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # S2c：覆盖而非追加 XFF。$proxy_add_x_forwarded_for 会把客户端自带的
        # X-Forwarded-For 拼接进头部，客户端可借此伪造 IP 绕过限流；此处只信任
        # 直连来源 $remote_addr。后端同时设置 trust proxy=1，此为双保险。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}

# ================= TLS 模板（默认关闭） =================
# 启用步骤：取消整块注释 → 填 server_name 与证书路径 → 把上面 80 server 的
# location / 改为 `return 301 https://$host$request_uri;`（或整块替换为跳转 server）
# → deploy/.env 设置 COOKIE_SECURE=true（见文件头说明）。
