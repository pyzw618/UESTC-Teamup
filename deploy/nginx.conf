# 生产 nginx 配置（挂载到 web 容器 /etc/nginx/conf.d/default.conf）
#
# 入口架构（详见 docs/DEPLOY_INGRESS.md）：
#   公网 IPv4/HTTPS 入口在 lcz：Internet → lcz nginx :443（Let's Encrypt 终止 TLS）
#   → frp 隧道 → 本容器 :80。因此：
#   - deploy/docker-compose.yml 中 web 端口只绑 127.0.0.1:18080，公网不可直连本机；
#   - 本层必须透传上游 XFF/XFP（见下方 /api/ location）；若改用 $remote_addr 覆盖，
#     真实客户端 IP 会丢失（限流退化 + 2026-10-13 线上事故复现）；
#   - TLS 证书与 80→443 跳转都在 lcz，本容器不再需要 443 server 块。
#   - 本机部署需在 deploy/.env 设置 COOKIE_SECURE=true、WEB_ORIGIN=https://teamup.20050917.xyz。
#
# 文末保留的 TLS 模板仅用于「无 lcz 前置层、本机直接对外」的备用部署方式。

server {
    listen 80;
    server_name _;

    # 前端静态资源（多阶段构建产物已拷入镜像）
    root /usr/share/nginx/html;
    index index.html;

    # M14：安全响应头（always 保证错误响应也带上）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 不在此处加 Content-Security-Policy：Element Plus 使用内联样式，CSP 会破坏页面渲染

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代（含 Cookie 会话）
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 上游为 lcz nginx（经 frp 隧道）：XFF/XFP 已由 lcz 覆盖清洗为真实客户端
        # 信息，此处原样透传，不再用 $remote_addr 覆盖（否则限流会把所有人算成同一 IP）。
        # 本服务端口只绑 127.0.0.1，公网无法绕过 lcz 直连伪造 XFF。
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}

# ================= TLS 模板（默认关闭） =================
