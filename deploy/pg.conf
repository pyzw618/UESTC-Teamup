# PostgreSQL 16 内存调优（2C2G 主机：DB 预算约 350MB）
# 依据 docs/TECH_STACK.md §7
# 使用自定义 config_file 时，官方镜像不会自动追加 listen_addresses，
# 默认仅监听 localhost，其他容器将无法连接（健康检查走 Unix socket 不受影响），必须显式开启
listen_addresses = '*'
port = 5432
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
max_connections = 50
maintenance_work_mem = 64MB
wal_buffers = 8MB
min_wal_size = 128MB
max_wal_size = 512MB
random_page_cost = 1.1
effective_io_concurrency = 200
