# 生产部署编排（单机 2C2G）
# 用法：在服务器上 docker compose -f deploy/docker-compose.yml up -d
version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置}
      POSTGRES_DB: teamup
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamup"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # M4：maxmemory-policy 用 volatile-lru 而非 allkeys-lru。
    # 本项目写入 Redis 的键（session / 验证码 / 限流计数）均带 TTL，allkeys-lru 在内存
    # 打满时会无差别逐出，包括无 TTL 的键与尚未过期的会话，表现为「随机登出」「限流计数
    # 被重置」；volatile-lru 只在带过期时间的键中淘汰，语义与使用方式一致。
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "volatile-lru", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 默认生产；当前 MAIL_PROVIDER=console 阶段被邮件模块生产守卫拒绝启动，
      # 暂处模式可在 .env 设 NODE_ENV=development（与上一版一致）。实装 SMTP 后删掉该覆盖。
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://teamup:${POSTGRES_PASSWORD}@db:5432/teamup
      REDIS_URL: redis://redis:6379
      # L12：后端 CORS 白名单读该变量，未设置时线上会恒回退 localhost，导致跨域请求被拒。
      # 生产请设为真实对外域名（如 https://teamup.example.edu.cn）
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      # S2b：仅当前置层已启用 HTTPS 时设为 true（后端已改为读取该变量控制 cookie Secure 标志；
      # nginx 当前仅监听 80，保持 false 否则浏览器会拒收 cookie 导致登录失效）
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 生产必须使用真实邮件 provider（安全收敛 A2）：console 模式验证码只进日志，
      # 后端会直接拒绝启动。请填写下方 QQ_SMTP_* （16 位授权码，非 QQ 密码）。
      MAIL_PROVIDER: ${MAIL_PROVIDER:-qq}
      # QQ 邮箱 SMTP（读取自 apps/api/src/modules/mail/qq-smtp.provider.ts / mail.module.ts）
      QQ_SMTP_HOST: ${QQ_SMTP_HOST:-smtp.qq.com}
      QQ_SMTP_PORT: ${QQ_SMTP_PORT:-465}
      QQ_SMTP_USER: ${QQ_SMTP_USER:-}
      # 16 位 SMTP 授权码（非邮箱登录密码）
      QQ_SMTP_PASS: ${QQ_SMTP_PASS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-UESTC TeamUp}
      # 全局每日发信上限（保护 QQ 邮箱额度，按实际额度调整）
      MAIL_GLOBAL_DAILY_LIMIT: ${MAIL_GLOBAL_DAILY_LIMIT:-200}
    # 2C2G 内存预算：API ~250MB
    deploy:
      resources:
        limits:
          memory: 320M

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # 生产公网入口在 lcz（Azure）的 nginx :443，经 frp 隧道接入本端口
      # （见 docs/DEPLOY_INGRESS.md）。只绑环回：公网无法绕过 lcz 直连本机。
      - "127.0.0.1:18080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # 静态资源 + 反代
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  pgdata:
